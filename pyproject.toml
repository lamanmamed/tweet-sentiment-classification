[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tweet-sentiment-classification"
version = "0.1.0"
description = "Tweet sentiment classification with a Linear SVM and tweet-aware text features"
requires-python = ">=3.10"
dependencies = [
    "nltk>=3.8",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
